<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ice Crack</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #070e1c;
      width: 100vw; height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    canvas { display: block; cursor: crosshair; }
    #hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(180, 220, 255, 0.65);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      letter-spacing: 0.4px;
      pointer-events: none;
      transition: opacity 1.2s ease;
      white-space: nowrap;
    }
    #reset-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(200,230,255,0.25);
      color: rgba(200,230,255,0.7);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      letter-spacing: 0.3px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    #reset-btn:active { background: rgba(255,255,255,0.22); }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Tap the ice to crack it</div>
<button id="reset-btn">Reset</button>

<script>
'use strict';

const canvas   = document.getElementById('c');
const ctx      = canvas.getContext('2d');
const hint     = document.getElementById('hint');
const resetBtn = document.getElementById('reset-btn');

// ─── Constants ────────────────────────────────────────────────────────────────
const SQ3 = Math.sqrt(3);

// Six axial directions for flat-top hex grid
const HEX_DIRS = [
  {q:1,r:0}, {q:1,r:-1}, {q:0,r:-1},
  {q:-1,r:0}, {q:-1,r:1}, {q:0,r:1},
];

// Visual config — line width and colour by edge depth (0=primary, 1=secondary…)
const LW      = [2.8, 1.9, 1.2, 0.8];
const SHADOW  = 'rgba(3,8,20,0.42)';
const CRACK_C = [
  'rgba(14,28,48,0.95)', 'rgba(11,23,42,0.82)',
  'rgba(9,18,36,0.65)',  'rgba(7,14,28,0.45)',
];
const HILITE_C = [
  'rgba(208,234,252,0.60)', 'rgba(200,228,250,0.32)',
  'rgba(190,222,248,0.15)', null,
];

const ANIM_MS     = 900;   // total animation duration (ms)
const EASE_K      = 4.6;   // exponential ease constant
const FLASH_MS    = 400;   // impact flash duration (ms)
const HEX_GLOW_MS = 600;   // per-hex glow fade duration (ms)

// ─── Globals ──────────────────────────────────────────────────────────────────
let W, H;        // canvas dimensions
let R;           // hex circumradius (px)
let hexes;       // Map<"q,r", {q,r,cx,cy,verts[]}>
let bgCanvas, bgCtx;
let dc = ctx;    // active drawing context (swapped when painting to bgCanvas)

// ─── Hex grid ─────────────────────────────────────────────────────────────────

function hexToPixel(q, r) {
  // Flat-top axial → pixel, centred at (W/2, H/2)
  return {
    x: W / 2 + R * 1.5 * q,
    y: H / 2 + R * SQ3 * (r + q / 2),
  };
}

function pixelToHex(px, py) {
  // Pixel → fractional axial, then cube-round to nearest hex
  const x = px - W / 2, y = py - H / 2;
  const qf = (2 / 3) * x / R;
  const rf = y / (R * SQ3) - qf / 2;
  return hexRound(qf, rf);
}

function hexRound(qf, rf) {
  const sf = -qf - rf;
  let rq = Math.round(qf), rr = Math.round(rf), rs = Math.round(sf);
  const dq = Math.abs(rq - qf), dr = Math.abs(rr - rf), ds = Math.abs(rs - sf);
  if (dq > dr && dq > ds) rq = -rr - rs;
  else if (dr > ds)        rr = -rq - rs;
  return { q: rq, r: rr };
}

function hexKey(q, r) { return `${q},${r}`; }

function calcVerts(cx, cy) {
  // Flat-top: vertex i is at angle i*60°
  const v = [];
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI / 3) * i;
    v.push({ x: cx + R * Math.cos(a), y: cy + R * Math.sin(a) });
  }
  return v;
}

function setupGrid() {
  // Aim for ~13 hexes across the short dimension, clamped to sane range
  R = Math.max(28, Math.min(62, Math.round(Math.min(W, H) / 13)));
  hexes = new Map();

  const qSpan = Math.ceil(W / (R * 1.5)) + 2;
  const rSpan = Math.ceil(H / (R * SQ3)) + 2;

  for (let q = -qSpan; q <= qSpan; q++) {
    for (let r = -rSpan; r <= rSpan; r++) {
      const { x, y } = hexToPixel(q, r);
      if (x > -R && x < W + R && y > -R && y < H + R) {
        hexes.set(hexKey(q, r), { q, r, cx: x, cy: y, verts: calcVerts(x, y) });
      }
    }
  }
}

// ─── Ice surface rendering ────────────────────────────────────────────────────

function renderIce() {
  const oc = bgCtx;
  oc.clearRect(0, 0, W, H);

  // Soft background gradient
  const gr = oc.createRadialGradient(W * 0.42, H * 0.38, 0, W * 0.5, H * 0.5, W * 0.72);
  gr.addColorStop(0,    '#F3F9FF');
  gr.addColorStop(0.5,  '#E4F2FF');
  gr.addColorStop(1,    '#C9E5FF');
  oc.fillStyle = gr;
  oc.fillRect(0, 0, W, H);

  // Draw each hex with a subtle per-hex tint (deterministic from coords)
  for (const hex of hexes.values()) {
    const n = Math.sin(hex.q * 3.71 + hex.r * 5.13) * 0.5
            + Math.cos(hex.q * 2.17 + hex.r * 7.83) * 0.5;  // -1 … 1
    const v = Math.round((n * 0.5 + 0.5) * 13);             // 0 … 13

    oc.beginPath();
    const { verts: vx, cx, cy } = hex;
    oc.moveTo(vx[0].x, vx[0].y);
    for (let i = 1; i < 6; i++) oc.lineTo(vx[i].x, vx[i].y);
    oc.closePath();
    oc.fillStyle = `rgb(${222 + v},${234 + Math.round(v * 0.65)},255)`;
    oc.fill();
    oc.strokeStyle = 'rgba(100,165,220,0.20)';
    oc.lineWidth = 0.7;
    oc.stroke();

    // One frost line per hex towards a deterministic vertex (stable between renders)
    const seed = (hex.q * 31 + hex.r * 17) & 0x3f;          // 0-63
    const ev   = vx[seed % 6];
    const seed2 = (hex.q * 13 + hex.r * 41) & 0xff;
    oc.beginPath();
    oc.moveTo(cx, cy);
    oc.lineTo(cx + (ev.x - cx) * 0.65, cy + (ev.y - cy) * 0.65);
    oc.strokeStyle = `rgba(150,200,238,${0.07 + (seed2 / 255) * 0.06})`;
    oc.lineWidth = 0.5;
    oc.stroke();
  }

  // Pixel-level noise for ice grain
  try {
    const id = oc.getImageData(0, 0, W, H);
    const d  = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = (Math.random() - 0.5) * 16;
      d[i]   = Math.max(0, Math.min(255, d[i]   + v));
      d[i+1] = Math.max(0, Math.min(255, d[i+1] + v * 0.8));
      d[i+2] = Math.max(0, Math.min(255, d[i+2] + v * 0.5));
    }
    oc.putImageData(id, 0, 0);
  } catch (_) { /* skip if cross-origin or oversized */ }
}

// ─── Crack tree generation ────────────────────────────────────────────────────

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Jagged line between two points — mirrors geometry.generate_jagged_line()
function jaggedLine(x1, y1, x2, y2, nSegs) {
  const pts = [{ x: x1, y: y1 }];
  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 1) return [{ x: x1, y: y1 }, { x: x2, y: y2 }];
  const px = -dy / dist, py = dx / dist;  // perpendicular unit vector
  for (let i = 1; i < nSegs; i++) {
    const t   = i / nSegs;
    const dev = (Math.random() - 0.5) * 0.22 * dist * Math.sin(t * Math.PI);
    pts.push({ x: x1 + dx * t + px * dev, y: y1 + dy * t + py * dev });
  }
  pts.push({ x: x2, y: y2 });
  return pts;
}

// Build a branching tree of crack segments rooted at originHex.
// Each edge: { pts, startD, endD, depth, child }
//   startD/endD = cumulative distance from origin along the crack network.
// Returns { root, maxD, ox, oy, reached }
//   reached: [{dist, hex}] — every hex the tree visits, with arrival distance
function genHexTree(originHex) {
  const used    = new Set([hexKey(originHex.q, originHex.r)]);
  const reached = [{ dist: 0, hex: originHex }];  // origin reached at dist 0

  function treeMaxD(node) {
    let m = 0;
    for (const e of node.edges) m = Math.max(m, e.endD, treeMaxD(e.child));
    return m;
  }

  function makeNode(hex, parentDist, depth) {
    const node = { hex, edges: [] };
    if (depth >= 3) return node;

    // How many outgoing cracks from this hex?
    let maxEdges;
    if (depth === 0) maxEdges = 4 + Math.floor(Math.random() * 4); // 4–7 from origin
    else if (depth === 1) {
      const r = Math.random();
      maxEdges = r < 0.50 ? 1 : r < 0.75 ? 2 : 0;
    } else {
      maxEdges = Math.random() < 0.30 ? 1 : 0;
    }
    if (maxEdges === 0) return node;

    const dirs = shuffle([...HEX_DIRS]);
    let count = 0;

    for (const dir of dirs) {
      if (count >= maxEdges) break;

      // Allow 2-hop jumps (skip an intermediate hex) ~20% of the time
      const hops = (depth <= 1 && Math.random() < 0.20) ? 2 : 1;

      // Walk 'hops' steps in this direction
      let target = hex;
      let valid  = true;
      for (let h = 0; h < hops; h++) {
        const nk = hexKey(target.q + dir.q, target.r + dir.r);
        const nh = hexes.get(nk);
        if (!nh) { valid = false; break; }
        target = nh;
      }
      if (!valid) continue;

      const tk = hexKey(target.q, target.r);
      if (used.has(tk)) continue;
      used.add(tk);

      // Segment: jagged line from hex centre to target centre
      const dx = target.cx - hex.cx, dy = target.cy - hex.cy;
      const segLen = Math.sqrt(dx * dx + dy * dy);
      const nSegs  = Math.max(4, Math.round(segLen / 10));
      const pts    = jaggedLine(hex.cx, hex.cy, target.cx, target.cy, nSegs);

      const arrivalDist = parentDist + segLen;
      reached.push({ dist: arrivalDist, hex: target });
      const child = makeNode(target, arrivalDist, depth + 1);
      node.edges.push({ pts, depth, startD: parentDist, endD: arrivalDist, child });
      count++;
    }
    return node;
  }

  const root = makeNode(originHex, 0, 0);
  const maxD = treeMaxD(root) || (R * SQ3);  // fallback: one hex width

  return { root, maxD, ox: originHex.cx, oy: originHex.cy, reached };
}

// ─── Hex glow effect ─────────────────────────────────────────────────────────

// Invert the easing to find when (ms after t0) the wavefront reaches `dist`.
function arrivalMs(dist, maxD) {
  const frac = dist / (maxD * 1.05);
  if (frac >= 1) return ANIM_MS;
  return Math.min(ANIM_MS, -Math.log(1 - Math.min(0.9999, frac)) / EASE_K * ANIM_MS);
}

// Draw a brief ice-blue radial glow on each hex as the wavefront passes through.
function drawHexGlows(anim, ts) {
  for (const { dist, hex } of anim.reached) {
    const elapsed = ts - (anim.t0 + arrivalMs(dist, anim.maxD));
    if (elapsed < 0 || elapsed >= HEX_GLOW_MS) continue;

    const t     = elapsed / HEX_GLOW_MS;
    const alpha = (1 - t) * 0.55;
    const { verts: vx, cx, cy } = hex;

    // Filled hex glow
    const gr = dc.createRadialGradient(cx, cy, 0, cx, cy, R * 0.92);
    gr.addColorStop(0,   `rgba(210,242,255,${alpha})`);
    gr.addColorStop(0.55,`rgba(175,222,250,${alpha * 0.55})`);
    gr.addColorStop(1,    'rgba(155,210,248,0)');
    dc.beginPath();
    dc.moveTo(vx[0].x, vx[0].y);
    for (let i = 1; i < 6; i++) dc.lineTo(vx[i].x, vx[i].y);
    dc.closePath();
    dc.fillStyle = gr;
    dc.fill();

    // Hex border pulse
    dc.beginPath();
    dc.moveTo(vx[0].x, vx[0].y);
    for (let i = 1; i < 6; i++) dc.lineTo(vx[i].x, vx[i].y);
    dc.closePath();
    dc.strokeStyle = `rgba(175,228,255,${alpha * 0.9})`;
    dc.lineWidth   = 1.5;
    dc.stroke();
  }
}

// ─── Drawing ──────────────────────────────────────────────────────────────────

function drawSubSeg(p1, p2, depth) {
  const d   = Math.min(depth, LW.length - 1);
  const lw  = LW[d];
  const ddx = p2.x - p1.x, ddy = p2.y - p1.y;
  const len = Math.sqrt(ddx * ddx + ddy * ddy);
  if (len < 0.4) return;
  const px = -ddy / len, py = ddx / len;  // perpendicular

  // Shadow
  dc.beginPath();
  dc.moveTo(p1.x + 1, p1.y + 1.5); dc.lineTo(p2.x + 1, p2.y + 1.5);
  dc.strokeStyle = SHADOW; dc.lineWidth = lw + 2.2; dc.lineCap = 'round';
  dc.stroke();

  // Dark crack body
  dc.beginPath();
  dc.moveTo(p1.x, p1.y); dc.lineTo(p2.x, p2.y);
  dc.strokeStyle = CRACK_C[d]; dc.lineWidth = lw;
  dc.stroke();

  // Ice-blue highlight on one edge
  const hi = HILITE_C[d];
  if (hi) {
    dc.beginPath();
    dc.moveTo(p1.x + px * 1.4, p1.y + py * 1.4);
    dc.lineTo(p2.x + px * 1.4, p2.y + py * 1.4);
    dc.strokeStyle = hi; dc.lineWidth = 1;
    dc.stroke();
  }
}

// Draw portion of one segment (pts array) up to fraction [0,1] of its length.
function drawEdgePartial(pts, frac, depth, showTip) {
  if (pts.length < 2) return;
  const totalSubs = pts.length - 1;
  const drawTo    = frac * totalSubs;
  const full      = Math.floor(drawTo);
  const partial   = drawTo - full;

  for (let i = 0; i < full; i++) drawSubSeg(pts[i], pts[i + 1], depth);

  if (full < totalSubs && partial > 0.001) {
    const p1 = pts[full], p2 = pts[full + 1];
    const ep = { x: p1.x + (p2.x - p1.x) * partial, y: p1.y + (p2.y - p1.y) * partial };
    drawSubSeg(p1, ep, depth);

    // Glowing tip at the active wavefront
    if (showTip && depth <= 1) {
      dc.beginPath();
      dc.arc(ep.x, ep.y, depth === 0 ? 3.5 : 2, 0, Math.PI * 2);
      dc.fillStyle = 'rgba(235,252,255,0.80)';
      dc.fill();
    }
  }
}

// Recursively draw the crack tree up to frontD from origin.
function drawTree(node, frontD, showTip) {
  for (const edge of node.edges) {
    if (edge.startD >= frontD) continue;

    const frac = (frontD - edge.startD) / (edge.endD - edge.startD);
    drawEdgePartial(edge.pts, Math.min(1, frac), edge.depth, frac < 1 && showTip);

    // Recurse into children only once this edge is fully drawn
    if (frac >= 1) drawTree(edge.child, frontD, showTip);
  }
}

function drawFlash(ox, oy, elapsedMs) {
  if (elapsedMs >= FLASH_MS) return;
  const t = elapsedMs / FLASH_MS;
  const r = 8 + 24 * t;
  const a = (1 - t) * 0.80;
  const g = dc.createRadialGradient(ox, oy, 0, ox, oy, r);
  g.addColorStop(0,   `rgba(255,255,255,${a})`);
  g.addColorStop(0.4, `rgba(220,242,255,${a * 0.5})`);
  g.addColorStop(1,   'rgba(200,235,255,0)');
  dc.beginPath(); dc.arc(ox, oy, r, 0, Math.PI * 2);
  dc.fillStyle = g; dc.fill();
}

// ─── Offscreen background cache ───────────────────────────────────────────────

function finalise(anim) {
  dc = bgCtx;
  drawTree(anim.root, Infinity, false);
  dc = ctx;
}

// ─── Main loop ────────────────────────────────────────────────────────────────

const activeAnims = [];

function loop(ts) {
  requestAnimationFrame(loop);
  ctx.drawImage(bgCanvas, 0, 0);
  dc = ctx;

  const done = [];
  for (const anim of activeAnims) {
    const t      = Math.min(1, (ts - anim.t0) / ANIM_MS);
    const eased  = 1 - Math.exp(-EASE_K * t);
    const frontD = eased * anim.maxD * 1.05;  // slight overshoot → clean finish

    drawHexGlows(anim, ts);
    drawTree(anim.root, frontD, true);
    drawFlash(anim.ox, anim.oy, ts - anim.t0);

    if (t >= 1) done.push(anim);
  }

  for (const a of done) {
    activeAnims.splice(activeAnims.indexOf(a), 1);
    finalise(a);
  }
}

// ─── Input ────────────────────────────────────────────────────────────────────

let hinted = false;

function tap(px, py) {
  if (!hinted) { hint.style.opacity = '0'; hinted = true; }

  const { q, r } = pixelToHex(px, py);
  const hex = hexes.get(hexKey(q, r));
  if (!hex) return;

  const anim = genHexTree(hex);
  activeAnims.push({ ...anim, t0: performance.now() });
}

canvas.addEventListener('click', e => tap(e.clientX, e.clientY));
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) tap(t.clientX, t.clientY);
}, { passive: false });

function doReset() {
  activeAnims.length = 0;
  renderIce();
  hinted = false;
  hint.style.opacity = '1';
}

resetBtn.addEventListener('click',      doReset);
resetBtn.addEventListener('touchstart', e => { e.stopPropagation(); doReset(); });
document.addEventListener('keydown',    e => { if (e.key === 'r' || e.key === 'R') doReset(); });

// ─── Init ─────────────────────────────────────────────────────────────────────

function init() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = W; bgCanvas.height = H;
  bgCtx = bgCanvas.getContext('2d');
  setupGrid();
  renderIce();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', () => {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  bgCanvas.width = W; bgCanvas.height = H;
  setupGrid();
  renderIce();
  activeAnims.length = 0;
});

init();
</script>
</body>
</html>
